# ----------------------------------------------------------
# Nginx Configuration — Insight Builder v4.0
# Optimized for SPA (Single-Page Application) routing
# ----------------------------------------------------------

server {
    listen       80;
    listen  [::]:80;
    server_name  localhost;

    root   /usr/share/nginx/html;
    index  index.html;

    # --------------------------------------------------
    # Security Headers (OWASP best-practices)
    # --------------------------------------------------
    add_header X-Frame-Options           "SAMEORIGIN"       always;
    add_header X-Content-Type-Options    "nosniff"           always;
    add_header X-XSS-Protection          "1; mode=block"     always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy        "camera=(), microphone=(), geolocation=()" always;

    # --------------------------------------------------
    # Gzip Compression
    # --------------------------------------------------
    gzip             on;
    gzip_vary        on;
    gzip_proxied     any;
    gzip_comp_level  6;
    gzip_min_length  256;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    # --------------------------------------------------
    # Static Asset Caching
    # Vite hashes filenames, so we can cache aggressively.
    # --------------------------------------------------
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # --------------------------------------------------
    # SPA Fallback
    # All non-file routes fall back to index.html so that
    # React Router can handle client-side routing.
    # --------------------------------------------------
    location / {
        try_files $uri $uri/ /index.html;
    }

    # --------------------------------------------------
    # Health-check endpoint for orchestrators
    # --------------------------------------------------
    location /healthz {
        access_log off;
        return 200 'OK';
        add_header Content-Type text/plain;
    }
}
